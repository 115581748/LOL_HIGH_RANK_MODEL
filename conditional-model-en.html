<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Compare each League of Legends match with champion- and role-matched OCE Diamond IV+ reference distributions.">
  <title>RiftScale · Champion-Matched Performance Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="conditional-model.css">
  <link rel="stylesheet" href="conditional-model-overrides.css">
</head>
<body>
  <script>
    // Keep one canonical page structure.  The English presentation layer also
    // observes all content subsequently produced by the model renderer.
    fetch("conditional-model.html").then(r => r.text()).then(html => {
      const parsed = new DOMParser().parseFromString(html, "text/html");
      document.body.replaceChildren(...Array.from(parsed.body.childNodes).filter(node => node.nodeName !== "SCRIPT"));
      const loadScript = (source) => new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = source; script.async = false; script.onload = resolve; script.onerror = reject;
        if (source.includes("loader")) script.dataset.app = "conditional-model-app.js";
        document.body.appendChild(script);
      });
      loadScript("assets/i18n-en.js")
        .then(() => loadScript("assets/runtime-config.js"))
        .then(() => loadScript("assets/conditional-model-loader.js"))
        .catch(error => console.error("Unable to start RiftScale", error));
    });
  </script>
</body>
</html>
